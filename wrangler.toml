name = "reader-rust-pages"
pages_build_output_dir = "dist"
compatibility_date = "2026-03-24"
compatibility_flags = ["nodejs_compat"]

# 1. Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "reader-db"
database_id = "reader-db"
migrations_dir = "migrations"

# 2. Cloudflare R2 Object Storage Bucket Binding
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "reader-storage"

# 3. Cloudflare Workers AI Binding (Free Edge GPU Inference)
[ai]
binding = "AI"

# 4. Environment Variables (Automatically injected by Wrangler from .env.example)
[vars]
SERVER_HOST = "0.0.0.0"
SERVER_PORT = "8080"
DATABASE_URL = "sqlite:storage/reader.db?mode=rwc"
STORAGE_DIR = "storage"
ASSETS_DIR = "storage/assets"
WEB_ROOT = "frontend/dist"
LOG_LEVEL = "info"
REQUEST_TIMEOUT_SECS = "15"
SECURE = "true"
SECURE_KEY = ""
INVITE_CODE = ""
USER_LIMIT = "50"
USER_BOOK_LIMIT = "2000"
USER_LOCAL_BOOK_LIMIT = "0"
CF_ACCOUNT_ID = ""
CF_API_TOKEN = ""
CF_KITESURF_ENDPOINT = ""
CF_KITESURF_ENABLED = "true"
REMOTE_WEBVIEW_API = ""
REMOTE_WEBVIEW_API_KEY = ""
D1_DATABASE_ID = ""
R2_BUCKET_NAME = "reader-storage"
STORAGE_BACKEND = "r2"
DATABASE_BACKEND = "d1"
